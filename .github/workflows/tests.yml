name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen
      # The output tests read the committed aggregates in out/; the rules tests run PolicyEngine-US.
      - run: uv run pytest
        env:
          OMP_NUM_THREADS: "1"
